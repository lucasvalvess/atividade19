{% extends 'base.html' %}

{% block title %}{% if tag %}Editar{% else %}Nova{% endif %} Tag - Portal Escolar{% endblock %}

{% block content %}
<h2>{% if tag %}Editar Tag: {{ tag.nome }}{% else %}Nova Tag{% endif %}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Salvar</button>
</form>

<a href="{% url 'noticias:tags' %}" class="btn-back">&larr; Voltar para as tags</a>
{% endblock %}
